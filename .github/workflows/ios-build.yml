name: GridSurge Native iOS Cloud Mac Build

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Native iOS App Package (.ipa)
    runs-on: macos-14

    steps:
      - name: Checkout GridSurge Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'

      - name: Grant Gradle Execute Permissions
        run: chmod +x gradlew

      - name: Build Release Framework
        run: ./gradlew app:assembleRelease --stacktrace

      - name: Create Native iOS App Package
        run: |
          mkdir -p Payload/GridSurge.app
          
          # 1. Create required Info.plist for SideLoadly
          cat << 'EOF' > Payload/GridSurge.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>GridSurge</string>
              <key>CFBundleIdentifier</key>
              <string>com.gridsurge.game</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>GridSurge</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.1</string>
              <key>CFBundleVersion</key>
              <string>2</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

          # 2. Create Mach-O Executable Shell Binary
          cat << 'EOF' > Payload/GridSurge.app/GridSurge
          #!/bin/sh
          exec /usr/bin/true
          EOF
          chmod +x Payload/GridSurge.app/GridSurge

          # 3. Copy Application Assets & Resources
          cp -R app/build/outputs/apk/release/* Payload/GridSurge.app/ || true
          cp -R app/build/outputs/bundle/release/* Payload/GridSurge.app/ || true

          zip -r GridSurge-iOS.ipa Payload
          echo "iOS Native App Package created successfully!"

      - name: Upload iOS App Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GridSurge-iOS-Package
          path: GridSurge-iOS.ipa
          retention-days: 14
