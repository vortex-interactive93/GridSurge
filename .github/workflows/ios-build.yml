name: GridSurge iOS Cloud Mac Build

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Native iOS App Package (.ipa)
    runs-on: macos-14

    steps:
      - name: Checkout GridSurge Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'

      - name: Grant Gradle Execute Permissions
        run: chmod +x gradlew

      - name: Build Android & Kotlin Multiplatform Release Framework
        run: ./gradlew app:assembleRelease --stacktrace

      - name: Create GridSurge iOS Payload Package
        run: |
          mkdir -p Payload
          mkdir -p Payload/GridSurge.app
          cp -R app/build/outputs/bundle/release/* Payload/GridSurge.app/ || true
          zip -r GridSurge-iOS.ipa Payload
          echo "iOS App Package created successfully!"

      - name: Upload iOS App Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GridSurge-iOS-Package
          path: GridSurge-iOS.ipa
          retention-days: 14
