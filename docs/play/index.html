<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GridSurge — Play Online (iOS & Web)</title>

    <!-- PWA & Mobile Safari Fullscreen Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GridSurge">
    <link rel="apple-touch-icon" href="../images/logo_title.png">

    <style>
        :root {
            --bg-color: #030712;
            --primary-cyan: #00E5FF;
            --accent-gold: #FFB300;
            --accent-green: #00E676;
            --accent-magenta: #D500F9;
            --card-bg: rgba(13, 21, 38, 0.9);
            --card-border: #1e2d4a;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 229, 255, 0.18) 0%, transparent 60%);
            color: #ffffff;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        /* Top HUD Header */
        .hud-header {
            width: 100%;
            max-width: 440px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border-bottom: 1.5px solid var(--primary-cyan);
            border-radius: 0 0 16px 16px;
            box-shadow: 0 4px 20px rgba(0, 229, 255, 0.2);
            z-index: 10;
        }

        .hud-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hud-label {
            font-size: 0.65rem;
            color: var(--primary-cyan);
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .hud-val {
            font-size: 1.2rem;
            font-weight: 900;
            color: #ffffff;
            font-family: monospace;
        }

        .btn-home {
            background: rgba(0, 229, 255, 0.15);
            border: 1px solid var(--primary-cyan);
            color: var(--primary-cyan);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 800;
            text-decoration: none;
        }

        /* Main Game Board Container */
        .board-container {
            width: 100%;
            max-width: 420px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        canvas#game-board {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: rgba(8, 13, 26, 0.95);
            border: 2px solid var(--primary-cyan);
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.25);
            touch-action: none;
        }

        /* Dock Tray Slots */
        .dock-container {
            width: 100%;
            max-width: 440px;
            padding: 12px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: var(--card-bg);
            border-top: 1.5px solid var(--card-border);
            border-radius: 16px 16px 0 0;
        }

        .dock-slot {
            width: 100px;
            height: 100px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Mobile Safari Install Hint Banner */
        .ios-hint {
            position: fixed;
            bottom: 120px;
            background: rgba(13, 21, 38, 0.95);
            border: 1px solid var(--accent-gold);
            border-radius: 12px;
            padding: 10px 16px;
            font-size: 0.8rem;
            color: var(--accent-gold);
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 179, 0, 0.3);
            max-width: 90%;
            display: none;
            z-index: 100;
        }
    </style>
</head>
<body>
    <!-- Top HUD Bar -->
    <div class="hud-header">
        <a href="../" class="btn-home">‹ WEBSITE</a>
        <div class="hud-box">
            <span class="hud-label">SCORE</span>
            <span class="hud-val" id="score-val">0</span>
        </div>
        <div class="hud-box">
            <span class="hud-label">COMBO</span>
            <span class="hud-val" id="combo-val" style="color: var(--accent-gold);">x1</span>
        </div>
    </div>

    <!-- Main Grid Canvas -->
    <div class="board-container">
        <canvas id="game-board" width="400" height="400"></canvas>
    </div>

    <!-- iOS Add To Home Screen Hint -->
    <div class="ios-hint" id="pwa-hint">
        💡 <strong>iPhone Tip:</strong> Tap Share ⎋ → <strong>"Add to Home Screen"</strong> to play in full screen!
    </div>

    <!-- Dock Tray Slots -->
    <div class="dock-container">
        <div class="dock-slot" id="dock-0"></div>
        <div class="dock-slot" id="dock-1"></div>
        <div class="dock-slot" id="dock-2"></div>
    </div>

    <script>
        // Check for iOS Safari
        const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
        if (isIos && !isStandalone) {
            document.getElementById('pwa-hint').style.display = 'block';
            setTimeout(() => { document.getElementById('pwa-hint').style.display = 'none'; }, 8000);
        }

        // Web Audio Synthesizer SFX
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSfx(freq = 440, duration = 0.1) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // 8x8 Grid Engine
        const GRID_SIZE = 8;
        const grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(0));
        let score = 0;
        let combo = 1;

        const canvas = document.getElementById('game-board');
        const ctx = canvas.getContext('2d');
        const CELL_SIZE = canvas.width / GRID_SIZE;

        // Block Skins Colors
        const COLORS = [
            'transparent',
            '#00E5FF', // Cyan
            '#FFB300', // Gold
            '#D500F9', // Magenta
            '#00E676', // Green
            '#FF1744'  // Red
        ];

        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const x = c * CELL_SIZE;
                    const y = r * CELL_SIZE;

                    // Cell Outline
                    ctx.strokeStyle = 'rgba(30, 45, 74, 0.6)';
                    ctx.strokeRect(x, y, CELL_SIZE, CELL_SIZE);

                    if (grid[r][c] > 0) {
                        ctx.fillStyle = COLORS[grid[r][c]];
                        ctx.beginPath();
                        ctx.roundRect(x + 2, y + 2, CELL_SIZE - 4, CELL_SIZE - 4, 6);
                        ctx.fill();
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }
            }
        }

        drawBoard();
    </script>
</body>
</html>
