<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GridSurge — Play Online (iOS & Web)</title>

    <!-- PWA & Mobile Safari Fullscreen Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GridSurge">
    <link rel="apple-touch-icon" href="../images/logo_title.png">

    <style>
        :root {
            --bg-color: #030712;
            --primary-cyan: #00E5FF;
            --accent-gold: #FFB300;
            --accent-green: #00E676;
            --accent-magenta: #D500F9;
            --accent-red: #FF1744;
            --card-bg: rgba(13, 21, 38, 0.92);
            --card-border: #1e2d4a;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 229, 255, 0.2) 0%, transparent 65%);
            color: #ffffff;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        /* Top HUD Header */
        .hud-header {
            width: 100%;
            max-width: 440px;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border-bottom: 1.5px solid var(--primary-cyan);
            border-radius: 0 0 16px 16px;
            box-shadow: 0 4px 25px rgba(0, 229, 255, 0.25);
            z-index: 10;
        }

        .hud-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hud-label {
            font-size: 0.65rem;
            color: var(--primary-cyan);
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .hud-val {
            font-size: 1.25rem;
            font-weight: 900;
            color: #ffffff;
            font-family: monospace;
        }

        .btn-home {
            background: rgba(0, 229, 255, 0.15);
            border: 1px solid var(--primary-cyan);
            color: var(--primary-cyan);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 800;
            text-decoration: none;
        }

        /* Main Game Board Container */
        .board-container {
            width: 100%;
            max-width: 420px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        canvas#game-board {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: rgba(8, 13, 26, 0.95);
            border: 2px solid var(--primary-cyan);
            border-radius: 18px;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.3);
            touch-action: none;
        }

        /* Dock Tray Slots */
        .dock-container {
            width: 100%;
            max-width: 440px;
            padding: 14px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: var(--card-bg);
            border-top: 1.5px solid var(--card-border);
            border-radius: 20px 20px 0 0;
            gap: 10px;
        }

        .dock-slot {
            width: 100px;
            height: 100px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }

        .dock-slot canvas {
            max-width: 80px;
            max-height: 80px;
        }

        /* Dragged Floating Canvas Overlay */
        #drag-canvas {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            display: none;
        }

        /* Mobile Safari Install Hint Banner */
        .ios-hint {
            position: fixed;
            bottom: 125px;
            background: rgba(13, 21, 38, 0.95);
            border: 1px solid var(--accent-gold);
            border-radius: 12px;
            padding: 10px 16px;
            font-size: 0.8rem;
            color: var(--accent-gold);
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 179, 0, 0.3);
            max-width: 90%;
            display: none;
            z-index: 100;
        }
    </style>
</head>
<body>
    <!-- Top HUD Bar -->
    <div class="hud-header">
        <a href="../" class="btn-home">‹ WEBSITE</a>
        <div class="hud-box">
            <span class="hud-label">SCORE</span>
            <span class="hud-val" id="score-val">0</span>
        </div>
        <div class="hud-box">
            <span class="hud-label">COMBO</span>
            <span class="hud-val" id="combo-val" style="color: var(--accent-gold);">x1</span>
        </div>
    </div>

    <!-- Main Grid Canvas -->
    <div class="board-container">
        <canvas id="game-board" width="400" height="400"></canvas>
    </div>

    <!-- iPhone PWA Hint -->
    <div class="ios-hint" id="pwa-hint">
        💡 <strong>iPhone Tip:</strong> Tap Share ⎋ → <strong>"Add to Home Screen"</strong> to play in full screen!
    </div>

    <!-- Floating Drag Canvas -->
    <canvas id="drag-canvas"></canvas>

    <!-- Dock Tray Slots -->
    <div class="dock-container">
        <div class="dock-slot" id="slot-0"></div>
        <div class="dock-slot" id="slot-1"></div>
        <div class="dock-slot" id="slot-2"></div>
    </div>

    <script>
        // Check for iOS Safari
        const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
        if (isIos && !isStandalone) {
            document.getElementById('pwa-hint').style.display = 'block';
            setTimeout(() => { document.getElementById('pwa-hint').style.display = 'none'; }, 8000);
        }

        // Web Audio Synthesizer SFX
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSfx(freq = 440, duration = 0.1) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        // Grid Engine Configuration
        const GRID_SIZE = 8;
        const grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(0));
        let score = 0;
        let combo = 1;

        const mainCanvas = document.getElementById('game-board');
        const ctx = mainCanvas.getContext('2d');
        const CELL_SIZE = mainCanvas.width / GRID_SIZE;

        const dragCanvas = document.getElementById('drag-canvas');
        const dragCtx = dragCanvas.getContext('2d');

        // Color Palette
        const COLORS = [
            'transparent',
            '#00E5FF', // 1: Cyan
            '#FFB300', // 2: Gold
            '#D500F9', // 3: Magenta
            '#00E676', // 4: Green
            '#FF1744'  // 5: Red
        ];

        // Block Catalog
        const SHAPES = [
            { shape: [[1]], color: 1 },
            { shape: [[1, 1]], color: 1 },
            { shape: [[1], [1]], color: 2 },
            { shape: [[1, 1, 1]], color: 2 },
            { shape: [[1], [1], [1]], color: 3 },
            { shape: [[1, 1], [1, 1]], color: 3 },
            { shape: [[1, 1, 1], [0, 1, 0]], color: 4 },
            { shape: [[1, 0], [1, 0], [1, 1]], color: 4 },
            { shape: [[1, 1, 1, 1]], color: 5 }
        ];

        let dockTray = [null, null, null];
        let draggingSlotIndex = -1;
        let dragOffset = { x: 0, y: 0 };

        function spawnTray() {
            for (let i = 0; i < 3; i++) {
                const randomShape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
                dockTray[i] = JSON.parse(JSON.stringify(randomShape));
            }
            renderDock();
        }

        function renderDock() {
            for (let i = 0; i < 3; i++) {
                valSlot = document.getElementById(`slot-${i}`);
                valSlot.innerHTML = '';

                if (dockTray[i]) {
                    const canvasSlot = document.createElement('canvas');
                    canvasSlot.width = 80;
                    canvasSlot.height = 80;
                    const slotCtx = canvasSlot.getContext('2d');

                    const shape = dockTray[i].shape;
                    const rows = shape.length;
                    const cols = shape[0].length;
                    const cellSize = Math.min(60 / cols, 60 / rows);
                    const offsetX = (80 - cols * cellSize) / 2;
                    const offsetY = (80 - rows * cellSize) / 2;

                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c < cols; c++) {
                            if (shape[r][c] === 1) {
                                slotCtx.fillStyle = COLORS[dockTray[i].color];
                                slotCtx.beginPath();
                                slotCtx.roundRect(offsetX + c * cellSize, offsetY + r * cellSize, cellSize - 2, cellSize - 2, 4);
                                slotCtx.fill();
                            }
                        }
                    }

                    valSlot.appendChild(canvasSlot);
                }
            }
        }

        function drawBoard(previewCoord = null, previewShape = null) {
            ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const x = c * CELL_SIZE;
                    const y = r * CELL_SIZE;

                    ctx.strokeStyle = 'rgba(30, 45, 74, 0.6)';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(x, y, CELL_SIZE, CELL_SIZE);

                    if (grid[r][c] > 0) {
                        ctx.fillStyle = COLORS[grid[r][c]];
                        ctx.beginPath();
                        ctx.roundRect(x + 2, y + 2, CELL_SIZE - 4, CELL_SIZE - 4, 6);
                        ctx.fill();
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 1.5;
                        ctx.stroke();
                    }
                }
            }

            // Draw Drag Preview Ghost
            if (previewCoord && previewShape) {
                const { gr, gc } = previewCoord;
                const rows = previewShape.shape.length;
                const cols = previewShape.shape[0].length;

                if (canPlace(gr, gc, previewShape.shape)) {
                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c < cols; c++) {
                            if (previewShape.shape[r][c] === 1) {
                                const x = (gc + c) * CELL_SIZE;
                                const y = (gr + r) * CELL_SIZE;
                                ctx.fillStyle = 'rgba(0, 229, 255, 0.4)';
                                ctx.beginPath();
                                ctx.roundRect(x + 2, y + 2, CELL_SIZE - 4, CELL_SIZE - 4, 6);
                                ctx.fill();
                            }
                        }
                    }
                }
            }
        }

        function canPlace(startRow, startCol, shape) {
            const rows = shape.length;
            const cols = shape[0].length;

            if (startRow < 0 || startCol < 0 || startRow + rows > GRID_SIZE || startCol + cols > GRID_SIZE) {
                return false;
            }

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (shape[r][c] === 1 && grid[startRow + r][startCol + c] > 0) {
                        return false;
                    }
                }
            }
            return true;
        }

        function placePiece(startRow, startCol, shapeObj) {
            const shape = shapeObj.shape;
            const rows = shape.length;
            const cols = shape[0].length;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (shape[r][c] === 1) {
                        grid[startRow + r][startCol + c] = shapeObj.color;
                    }
                }
            }

            playSfx(580, 0.08);
            checkLineClears();
        }

        function checkLineClears() {
            const clearedRows = [];
            const clearedCols = [];

            for (let r = 0; r < GRID_SIZE; r++) {
                if (grid[r].every(val => val > 0)) clearedRows.push(r);
            }

            for (let c = 0; c < GRID_SIZE; c++) {
                let full = true;
                for (let r = 0; r < GRID_SIZE; r++) {
                    if (grid[r][c] === 0) full = false;
                }
                if (full) clearedCols.push(c);
            }

            const totalClears = clearedRows.length + clearedCols.length;
            if (totalClears > 0) {
                clearedRows.forEach(r => grid[r].fill(0));
                clearedCols.forEach(c => {
                    for (let r = 0; r < GRID_SIZE; r++) grid[r][c] = 0;
                });

                combo++;
                score += totalClears * 100 * combo;
                playSfx(880, 0.2);
            } else {
                combo = 1;
                score += 10;
            }

            document.getElementById('score-val').textContent = score;
            document.getElementById('combo-val').textContent = `x${combo}`;
            drawBoard();
        }

        // Drag and Drop Touch Events
        function setupInteraction() {
            for (let i = 0; i < 3; i++) {
                const slot = document.getElementById(`slot-${i}`);

                const startDrag = (e) => {
                    if (!dockTray[i]) return;
                    draggingSlotIndex = i;
                    playSfx(400, 0.05);

                    const touch = e.touches ? e.touches[0] : e;
                    const shape = dockTray[i].shape;
                    const rows = shape.length;
                    const cols = shape[0].length;

                    dragCanvas.width = cols * CELL_SIZE;
                    dragCanvas.height = rows * CELL_SIZE;

                    dragCtx.clearRect(0, 0, dragCanvas.width, dragCanvas.height);
                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c < cols; c++) {
                            if (shape[r][c] === 1) {
                                dragCtx.fillStyle = COLORS[dockTray[i].color];
                                dragCtx.beginPath();
                                dragCtx.roundRect(c * CELL_SIZE + 2, r * CELL_SIZE + 2, CELL_SIZE - 4, CELL_SIZE - 4, 6);
                                dragCtx.fill();
                            }
                        }
                    }

                    dragCanvas.style.display = 'block';
                    moveDrag(e);
                };

                slot.addEventListener('touchstart', startDrag);
                slot.addEventListener('mousedown', startDrag);
            }

            const moveDrag = (e) => {
                if (draggingSlotIndex === -1) return;
                const touch = e.touches ? e.touches[0] : e;

                dragCanvas.style.left = `${touch.clientX - dragCanvas.width / 2}px`;
                dragCanvas.style.top = `${touch.clientY - dragCanvas.height - 20}px`;

                const rect = mainCanvas.getBoundingClientRect();
                const mx = touch.clientX - rect.left;
                const my = (touch.clientY - 20) - rect.top;

                const gc = Math.floor(mx / (rect.width / GRID_SIZE));
                const gr = Math.floor(my / (rect.height / GRID_SIZE));

                drawBoard({ gr, gc }, dockTray[draggingSlotIndex]);
            };

            const endDrag = (e) => {
                if (draggingSlotIndex === -1) return;

                const rect = mainCanvas.getBoundingClientRect();
                const touch = e.changedTouches ? e.changedTouches[0] : e;
                const mx = touch.clientX - rect.left;
                const my = (touch.clientY - 20) - rect.top;

                const gc = Math.floor(mx / (rect.width / GRID_SIZE));
                const gr = Math.floor(my / (rect.height / GRID_SIZE));

                const piece = dockTray[draggingSlotIndex];

                if (canPlace(gr, gc, piece.shape)) {
                    placePiece(gr, gc, piece);
                    dockTray[draggingSlotIndex] = null;
                    renderDock();

                    if (dockTray.every(p => p === null)) {
                        spawnTray();
                    }
                }

                draggingSlotIndex = -1;
                dragCanvas.style.display = 'none';
                drawBoard();
            };

            window.addEventListener('touchmove', moveDrag);
            window.addEventListener('mousemove', moveDrag);
            window.addEventListener('touchend', endDrag);
            window.addEventListener('mouseup', endDrag);
        }

        spawnTray();
        setupInteraction();
    </script>
</body>
</html>
